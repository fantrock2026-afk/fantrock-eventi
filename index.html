<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantrock Eventi</title><style>body{font-family:system-ui;background:#15151a;color:white;margin:0}header{background:#25252d;padding:20px;border-bottom:3px solid #e43b4c}h1{margin:0}.wrap{max-width:800px;margin:auto;padding:14px}.bar{display:flex;align-items:center;justify-content:space-between;gap:7px}button{background:#e43b4c;color:white;border:0;border-radius:9px;padding:12px;cursor:pointer;font-size:15px}.secondary{background:#41414a}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}.day{background:#292932;border-radius:7px;min-height:72px;padding:5px;overflow:hidden;cursor:pointer}.day.active{outline:2px solid #e43b4c}.weekday{text-align:center;color:#aaa;font-size:12px}.pill{background:#84313b;font-size:10px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px;padding:3px;border-radius:4px}.panel{background:#25252d;padding:16px;margin-top:18px;border-radius:12px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #777;border-radius:8px;background:#18181e;color:white;font:inherit}label{display:block;margin:12px 0 5px}.item{border-bottom:1px solid #555;padding:10px 0;display:flex;justify-content:space-between;gap:8px}.muted{color:#bbb;font-size:13px}@media(max-width:480px){.day{min-height:61px}.bar button{padding:9px}#month{font-size:15px}}</style></head><body><header><h1>🎸 FANTROCK EVENTI</h1><span class="muted">Calendario del locale</span></header><main class="wrap"><div class="bar"><button class="secondary" id="prev">‹</button><strong id="month"></strong><button class="secondary" id="next">›</button><button id="add">+ Evento</button></div><div class="calendar" id="calendar"></div><section id="editor" class="panel" hidden><h2 id="heading">Nuovo evento</h2><form id="form"><input type="hidden" id="eid"><label>Data</label><input type="date" id="date" required><label>Ora</label><input type="time" id="time" required><label>Nome band / evento</label><input id="name" required maxlength="100"><label>Note</label><textarea id="notes" rows="3"></textarea><p><button type="submit">Salva evento</button> <button type="button" class="secondary" id="cancel">Annulla</button> <button type="button" class="secondary" id="delete" hidden>Elimina</button></p></form></section><section class="panel"><h2 id="chosen"></h2><div id="events"></div></section><p class="muted">DEMO: gli eventi si salvano solo in questo browser. Non inserire informazioni riservate. Accessi e sincronizzazione tra soci saranno aggiunti successivamente.</p></main><script>
const $=id=>document.getElementById(id),key='fantrock_events_local_v1';let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){};let view=new Date(),chosen=dateStr(view);function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function persist(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){alert('Salvataggio non disponibile in questo browser')}render()}function render(){const y=view.getFullYear(),m=view.getMonth();$('month').textContent=view.toLocaleDateString('it-IT',{month:'long',year:'numeric'});let h=['L','M','M','G','V','S','D'].map(x=>'<div class="weekday">'+x+'</div>').join('');const offset=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<offset;i++)h+='<div></div>';for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const dt=dateStr(new Date(y,m,d)),items=data.filter(e=>e.date===dt).sort((a,b)=>a.time.localeCompare(b.time));h+='<div class="day '+(dt===chosen?'active':'')+'" data-date="'+dt+'"><b>'+d+'</b>'+items.slice(0,3).map(e=>'<span class="pill">'+safe(e.time+' '+e.name)+'</span>').join('')+'</div>'}$('calendar').innerHTML=h;document.querySelectorAll('.day').forEach(x=>x.onclick=()=>{chosen=x.dataset.date;render()});$('chosen').textContent='Eventi del '+new Date(chosen+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});const items=data.filter(e=>e.date===chosen).sort((a,b)=>a.time.localeCompare(b.time));$('events').innerHTML=items.length?items.map(e=>'<div class="item"><div><b>'+safe(e.time+' · '+e.name)+'</b><div class="muted">'+safe(e.notes)+'</div></div><button class="secondary edit" data-id="'+safe(e.id)+'">Modifica</button></div>').join(''):'<p class="muted">Nessun evento per questo giorno.</p>';document.querySelectorAll('.edit').forEach(x=>x.onclick=()=>openEditor(x.dataset.id))}function openEditor(id){const e=data.find(x=>x.id===id);$('form').reset();$('eid').value=e?.id||'';$('date').value=e?.date||chosen;$('time').value=e?.time||'22:00';$('name').value=e?.name||'';$('notes').value=e?.notes||'';$('heading').textContent=e?'Modifica evento':'Nuovo evento';$('delete').hidden=!e;$('editor').hidden=false;$('editor').scrollIntoView({behavior:'smooth'})}$('add').onclick=()=>openEditor();$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);chosen=dateStr(view);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);chosen=dateStr(view);render()};$('cancel').onclick=()=>$('editor').hidden=true;$('delete').onclick=()=>{if(confirm('Eliminare questo evento?')){data=data.filter(x=>x.id!==$('eid').value);$('editor').hidden=true;persist()}};$('form').onsubmit=e=>{e.preventDefault();const id=$('eid').value||Date.now().toString(36)+Math.random().toString(36).slice(2);data=data.filter(x=>x.id!==id);data.push({id,date:$('date').value,time:$('time').value,name:$('name').value.trim(),notes:$('notes').value.trim()});chosen=$('date').value;view=new Date(chosen+'T12:00:00');$('editor').hidden=true;persist()};render();
</script></body></html>
